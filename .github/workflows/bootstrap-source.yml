name: Bootstrap Public Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/printflow.tar.gz.b64
          base64 --decode /tmp/printflow.tar.gz.b64 > /tmp/printflow.tar.gz
          tar -xzf /tmp/printflow.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Publish sanitized PrintFlow CRM v0.7.47 source'
          git push
