name: Publish Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'PrintFlowCRM.pyw'
      - 'MessengerCapture.pyw'
      - 'SetupWizard.pyw'
      - 'requirements.txt'
      - 'update_manifest.json'
      - 'Install-PrintFlowCRM.ps1'
      - 'Install PrintFlow CRM.bat'
      - 'Run PrintFlow CRM.bat'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile PrintFlowCRM.pyw MessengerCapture.pyw SetupWizard.pyw
          $m = Get-Content update_manifest.json -Raw | ConvertFrom-Json
          foreach ($file in $m.app_files) {
            if (-not (Test-Path $file)) { throw "Manifest file missing: $file" }
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Get-Content update_manifest.json -Raw | ConvertFrom-Json
          $version = [string]$m.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Manifest version is empty.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Build Windows ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $root = Join-Path $PWD 'dist\PrintFlowCRM'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $files = @(
            'PrintFlowCRM.pyw',
            'MessengerCapture.pyw',
            'SetupWizard.pyw',
            'requirements.txt',
            'update_manifest.json',
            'Install-PrintFlowCRM.ps1',
            'Install PrintFlow CRM.bat',
            'Run PrintFlow CRM.bat',
            'README.md',
            'LICENSE'
          )
          foreach ($f in $files) { Copy-Item $f $root -Force }
          $zip = Join-Path $PWD "dist\PrintFlowCRM-v$env:VERSION-Windows.zip"
          Compress-Archive -Path $root -DestinationPath $zip -Force
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG $env:ZIP_PATH --target $env:GITHUB_SHA --title "PrintFlow CRM v$env:VERSION" --generate-notes
